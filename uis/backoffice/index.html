<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCore - Directorio de Proveedores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏥 HealthCore Digital</h1>
        <h2>Directorio de Proveedores</h2>
    </header>

    <main>
        <!-- Filtros -->
        <section class="filters">
            <label for="filter-country">País:</label>
            <select id="filter-country">
                <option value="">Todos</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
            </select>

            <label for="filter-category">Categoría:</label>
            <select id="filter-category">
                <option value="">Todas</option>
                <option value="Medical Equipment">Medical Equipment</option>
                <option value="PPE">PPE</option>
                <option value="Pharmaceuticals">Pharmaceuticals</option>
                <option value="Lab Supplies">Lab Supplies</option>
            </select>
        </section>

        <!-- Tabla de Proveedores -->
        <section class="table-container">
            <table id="suppliers-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>País</th>
                        <th>Categorías</th>
                        <th>Tarifa</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="suppliers-body">
                    <!-- JavaScript insertará los datos aquí -->
                </tbody>
            </table>
        </section>

        <!-- Formulario para añadir proveedor -->
        <section class="add-form">
            <h3>Añadir Nuevo Proveedor</h3>
            <form id="supplier-form">
                <input type="text" id="name" placeholder="Nombre del proveedor" required>
                <select id="country" required>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                </select>
                <select id="category" required>
                    <option value="Medical Equipment">Medical Equipment</option>
                    <option value="PPE">PPE</option>
                    <option value="Pharmaceuticals">Pharmaceuticals</option>
                    <option value="Lab Supplies">Lab Supplies</option>
                </select>
                <input type="number" id="rate" placeholder="Tarifa (ej. 1500.50)" step="0.01" min="0.01" required>
                <button type="submit">Añadir Proveedor</button>
            </form>
            <p id="form-message"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
