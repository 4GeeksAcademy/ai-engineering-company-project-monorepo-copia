[project]
name = "api"
version = "0.1.0"
description = "API para el directorio de proveedores de HealthCore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "tinydb",
    "pydantic"
]

# ✅ Definimos el comando uv run seed
[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ✅ Obligamos a hatchling a incluir los archivos .py de esta carpeta y la de routes
[tool.hatch.build.targets.wheel]
include = ["*.py", "routes/*.py"]