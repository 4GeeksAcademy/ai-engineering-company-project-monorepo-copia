[project]
name = "healthcore-suppliers-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.29.0",
    "tinydb>=4.8.0",
    "pydantic>=2.6.0",
    "email-validator>=2.1.0",
]

[project.scripts]
seed = "seed:main"
[tool.uv]
package = true

[tool.setuptools]
py-modules = ["database", "seed"]
